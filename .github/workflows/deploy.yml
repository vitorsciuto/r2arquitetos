name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Por que não `npm ci`: o lockfile é gerado no Windows, e lá o npm não
      # resolve as dependências transitivas das variantes de outra plataforma
      # do sharp — @emnapi/core e @emnapi/runtime, exigidas pelo
      # @img/sharp-wasm32. No Linux elas entram na conta e o `npm ci`, que é
      # rigoroso por definição, aborta com EUSAGE. Não dá para consertar o
      # lockfile a partir do Windows, nem forçando --os=linux.
      # Para voltar ao `npm ci`: regerar o package-lock.json no Linux (WSL,
      # container ou Codespace) e trocar esta linha de volta.
      - run: npm install --no-audit --no-fund

      # Precisa vir DEPOIS da instalação: o npm ci apaga o node_modules
      # inteiro, e levaria junto o cache restaurado.
      - name: Cache das imagens processadas
        uses: actions/cache@v6
        with:
          path: node_modules/.astro/assets
          key: astro-assets-${{ hashFiles('src/assets/**', 'src/lib/material/**', 'astro.config.mjs') }}
          restore-keys: |
            astro-assets-

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
