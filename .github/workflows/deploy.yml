name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Instalação determinística: só o que está no package-lock.json, sem
      # resolver versão nova nenhuma. Se um dia voltar a falhar com
      # "Missing: ... from lock file", é porque alguém mexeu em dependência
      # no Windows — rode o workflow "Regerar o lockfile no Linux".
      - run: npm ci

      # Precisa vir DEPOIS da instalação: o npm ci apaga o node_modules
      # inteiro, e levaria junto o cache restaurado.
      - name: Cache das imagens processadas
        uses: actions/cache@v6
        with:
          path: node_modules/.astro/assets
          key: astro-assets-${{ hashFiles('src/assets/**', 'src/lib/material/**', 'astro.config.mjs') }}
          restore-keys: |
            astro-assets-

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
